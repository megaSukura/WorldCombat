modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-or-later; see LICENSE and LICENSE-MINECRAFT-EXCEPTION.txt"

[[mixins]]
config = "world_combat_core.mixins.json"


[[mods]]
modId = "world_combat_core"
version = "${mod_version}"
displayName = "World Combat Core"
description = "Scripted world-combat runtime, validated actions and lifecycle management. Particle presentation requires MadParticle (GPL-3.0, USS_Shenzhou) and T88 as prerequisites."

[[dependencies.world_combat_core]]
modId = "minecraft"
